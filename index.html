      body {
        font-family: 'Inter', sans-serif;
        background-color: var(--bg-main);
        color: var(--text-main);
        overflow-x: hidden;
        min-height: 100vh;
        min-height: 100dvh;
        transition: background-color 0.5s ease, color 0.5s ease;
        /* Disable text selection globally */
        -webkit-user-select: none;
        -moz-user-select: none;
        -ms-user-select: none;
        user-select: none;
        cursor: default;
      }
      
      html {
        overflow-x: hidden;
        max-width: 100vw;
      }
      
      /* Mobile scroll lock helper - applied via JS */
      @media (max-width: 1023px) {
        html.scroll-locked,
        html.scroll-locked body {
          overflow: hidden !important;
          position: fixed !important;
          width: 100% !important;
          height: 100% !important;
          touch-action: none !important;
          overscroll-behavior: none !important;
        }
      }
      
      /* Re-enable text selection for inputs and textareas */
      input, textarea {
        -webkit-user-select: text;
        -moz-user-select: text;
        -ms-user-select: text;
        user-select: text;
        cursor: text;
      }

      /* Hide standard arrow spinners */
      input[type=number]::-webkit-inner-spin-button, 
      input[type=number]::-webkit-outer-spin-button { 
        -webkit-appearance: none; 
        margin: 0; 
      }
      input[type=number] {
        -moz-appearance: textfield;
      }
      
      /* Custom Scrollbar */
      ::-webkit-scrollbar {
        width: 8px;
      }
      ::-webkit-scrollbar-track {
        background: var(--bg-main); 
      }
      ::-webkit-scrollbar-thumb {
        background: #27272a; 
        border-radius: 4px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #3f3f46; 
      }

      /* Animations */
      @keyframes fadeInUp {
        from {
          opacity: 0;
          transform: translateY(20px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }
      
      @keyframes fadeInDown {
        from {
          opacity: 0;
          transform: translateY(-20px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      @keyframes float {
        0%, 100% {
          transform: translateY(0px);
        }
        50% {
          transform: translateY(-20px);
        }
      }

      @keyframes floatDelayed {
        0%, 100% {
          transform: translateY(0px);
        }
        50% {
          transform: translateY(-15px);
        }
      }

      @keyframes ripple {
        0% {
            transform: scale(0.8);
            opacity: 1;
        }
        100% {
            transform: scale(3);
            opacity: 0;
        }
      }

      @keyframes subtleBounce {
        0%, 100% {
            transform: translateY(0);
        }
        50% {
            transform: translateY(-4px);
        }
      }

      @keyframes subtleBounceSmall {
        0%, 100% {
            transform: translateY(0);
        }
        50% {
            transform: translateY(-2px);
        }
      }

      /* Flashing ring animation for roadmap down arrow - GPU accelerated */
      @keyframes flashRing {
        0%, 100% {
            box-shadow: 0 0 0 0 rgba(0, 0, 0, 0);
        }
        50% {
            box-shadow: 0 0 0 1px var(--primary-50);
        }
      }

      /* New looping draw animation */
      @keyframes draw-loop {
        0% {
            stroke-dasharray: 0, 2000;
            stroke-dashoffset: 0;
            opacity: 0;
        }
        10% {
            opacity: 1;
        }
        60% {
            stroke-dasharray: 2000, 0;
            stroke-dashoffset: 0;
            opacity: 1;
        }
        70% {
            opacity: 0;
        }
        100% {
            opacity: 0;
        }
      }

      .animate-fade-in-up {
        animation: fadeInUp 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      }

      .animate-fade-in-down {
        animation: fadeInDown 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      }

      .animate-float {
        animation: float 6s ease-in-out infinite;
      }

      .animate-float-delayed {
        animation: floatDelayed 8s ease-in-out infinite 2s;
      }

      .animate-ripple {
        animation: ripple 2s linear infinite;
      }

      .animate-draw-loop {
        animation: draw-loop 6s linear infinite;
      }

      .delay-100 { animation-delay: 100ms; }
      .delay-200 { animation-delay: 200ms; }
      .delay-300 { animation-delay: 300ms; }
      .delay-600 { animation-delay: 600ms; }

      /* Custom Range Slider Styling */
      input[type=range] {
        -webkit-appearance: none;
        width: 100%;
        background: transparent;

        cursor: pointer;
        margin-top: -7px;
        box-shadow: 0 0 10px var(--primary);

      }
      
      input[type=range]::-webkit-slider-thumb:hover {

      }

      input[type=range]::-moz-range-thumb {

        width: 18px;

        box-shadow: 0 0 10px var(--primary);

        cursor: pointer;
        border-radius: 999px;
      }
      
      input[type=range]:focus {
        outline: none;
      }

        padding-bottom: env(safe-area-inset-bottom, 0px);

        scrollbar-width: none;
      }

        html, body {
          overflow-x: hidden;
          max-width: 100vw;

<script type="module">
  // Your web app's Firebase configuration
  const firebaseConfig = {
    apiKey: "AIzaSyDdnKgoq03cbiiDzXdyUppPbaRzdarsS1A",
    authDomain: "regretcalculator-93baa.firebaseapp.com",
    databaseURL: "https://regretcalculator-93baa-default-rtdb.firebaseio.com",
    projectId: "regretcalculator-93baa",
    storageBucket: "regretcalculator-93baa.firebasestorage.app",
    messagingSenderId: "120485266617",
    appId: "1:120485266617:web:e8ed6a8dca6eae1bf44768"
  };

  // Import and initialize Firebase with correct ESM URLs
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
  import { getDatabase, ref, onValue, runTransaction, push, set, remove, onDisconnect, query, limitToLast, orderByChild } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";
  import { getAuth, signInWithEmailAndPassword, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

  const app = initializeApp(firebaseConfig);
  const database = getDatabase(app);
  const auth = getAuth(app);
  const counterRef = ref(database, 'decisionsAnalyzed');

  // Expose Firebase for React components
  window.firebaseDB = database;
  window.firebaseAuth = auth;
  window.firebaseRef = ref;
  window.firebaseOnValue = onValue;
  window.firebaseRunTransaction = runTransaction;
  window.firebasePush = push;
  window.firebaseSet = set;
  window.firebaseRemove = remove;
  window.firebaseOnDisconnect = onDisconnect;
  window.firebaseQuery = query;
  window.firebaseLimitToLast = limitToLast;
  window.firebaseOrderByChild = orderByChild;
  window.firebaseSignIn = signInWithEmailAndPassword;
  window.firebaseSignOut = signOut;
  window.firebaseOnAuthStateChanged = onAuthStateChanged;

  // 1. Function to update the counter display in real-time
  onValue(counterRef, (snapshot) => {
    let count = snapshot.val();
    // Enforce minimum floor of 3564 even if DB has lower (e.g. 546)
    if (!count || count < 3564) {
        count = 3564;
    }
    
    // Update the React state via the global setter if available
    if (window.setGlobalDecisionCount) {
        window.setGlobalDecisionCount(count);
    }
  });

  // 2. Make the increment function globally accessible for App.tsx to call
  window.incrementCounter = function() {
    runTransaction(counterRef, (currentCount) => {
      // If doesn't exist or is too low, jump to baseline + 1
      if (!currentCount || currentCount < 3564) {
          return 3565;
      }
      return currentCount + 1;
    });
  };

  // 3. NEW: Global function to log activity events
  window.logActivityEvent = function(data) {
    const activityRef = ref(database, 'analytics/activity_log');
    const newEntryRef = push(activityRef);
    set(newEntryRef, {
      city: data.city || 'Unknown',
      timestamp: Date.now(),
      regretAmount: Math.round(data.regretAmount),
      expenseName: data.expenseName || 'Expense'
    });
  };
</script>
